ain</text><path d="M 82 358 H 368" fill="none" stroke="#365975" stroke-width="1.8"/><path d="M 359 354 L 368 358 L 359 362" fill="none" stroke="#365975" stroke-width="1.8"/><rect x="181.0" y="329" width="88" height="21" fill="#f8fafd"/><text x="225.0" y="345" text-anchor="middle" font-size="15" font-weight="400" fill="#365975">4  SayHello</text><path d="M 368 438 H 82" fill="none" stroke="#28665c" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M 91 434 L 82 438 L 91 442" fill="none" stroke="#28665c" stroke-width="1.8"/><rect x="182.0" y="409" width="86" height="21" fill="#f8fafd"/><text x="225.0" y="425" text-anchor="middle" font-size="15" font-weight="400" fill="#28665c">5  返回问候</text></svg>