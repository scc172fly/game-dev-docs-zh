<svg xmlns="http://www.w3.org/2000/svg" width="720" height="362" viewBox="0 0 720 362" font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" role="img"><title>ActivationData 的生命周期</title><desc>初始为 Creating。正常路径依次进入 Activating、Valid、Deactivating、Invalid。Creating 和 Activating 也能直接转入 Deactivating。</desc><rect width="100%" height="100%" fill="#f8fafd"/><rect x="50" y="67" width="153" height="68" rx="15" fill="#eff6f4" stroke="#909fb2" stroke-width="1.4"/><text x="126.5" y="95" text-anchor="middle" font-size="17" font-weight="600" fill="#27486b">Creating</text><text x="126.5" y="120" text-anchor="middle" font-size="15" font-weight="400" fill="#506479">正在创建</text><rect x="286" y="67" width="153" height="68" rx="15" fill="#eff6f4" stroke="#909fb2" stroke-width="1.4"/><text x="362.5" y="95" text-anchor="middle" font-size="17" font-weight="600" fill="#27486b">Activating</text><text x="362.5" y="120" text-anchor="middle" font-size="15" font-weight="400" fill="#506479">执行激活回调</text><rect x="522" y="67" width="153" height="68" rx="15" fill="#eff6f4" stroke="#909fb2" stroke-width="1.4"/><text x="598.5" y="95" text-anchor="middle" font-size="17" font-weight="600" fill="#27486b">Valid</text><text x="598.5" y="120" text-anchor="middle" font-size="15" font-weight="400" fill="#506479">可以处理请求</text><rect x="286" y="257" width="153" height="68" rx="15" fill="#eff6f4" stroke="#909fb2" stroke-width="1.4"/><text x="362.5" y="285" text-anchor="middle" font-size="17" font-weight="600" fill="#27486b">Deactivating</text><text x="362.5" y="310" text-anchor="middle" font-size="15" font-weight="400" fill="#506479">正在停用</text><rect x="522" y="257" width="153" height="68" rx="15" fill="#eff6f4" stroke="#909fb2" stroke-width="1.4"/><text x="598.5" y="285" text-anchor="middle" font-size="17" font-weight="600" fill="#27486b">Invalid</text><text x="598.5" y="310" text-anchor="middle" font-size="15" font-weight="400" fill="#506479">激活已失效</text><circle cx="17" cy="101" r="6" fill="#27486b"/