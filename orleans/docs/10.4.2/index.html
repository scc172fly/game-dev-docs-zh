  <script>
    (() => {
      let preference = 'auto', systemDark = false;
      try { const stored = localStorage.getItem('orleans-theme'); if (['auto', 'dark', 'light'].includes(stored)) preference = stored; } catch {}
      try { systemDark = matchMedia('(prefers-color-scheme: dark)').matches; } catch {}
      const root = document.documentElement;
      root.dataset.themePreference = preference;
      root.dataset.theme = preference === 'auto' ? (systemDark ? 'dark' : 'light') : preference;
      root.style.colorScheme = root.dataset.theme;
    })();
  </script>
